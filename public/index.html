<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aus Air Electrical — Test &amp; Tag</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-aus">AUS</span><span class="brand-air">AIR</span><span class="brand-elec">ELECTRICAL</span></div>
    <div class="app-title">Test &amp; Tag Register</div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="scan">Scan Tag</button>
    <button class="tab-btn" data-tab="register">Register</button>
  </nav>

  <main id="app">
    <!-- SCAN TAB -->
    <section id="tab-scan" class="tab-panel active">
      <div id="tokenGate" class="card" style="display:none;">
        <h3>Access token</h3>
        <p>Enter the shared team access token to use this app.</p>
        <input id="tokenInput" type="password" placeholder="Access token" />
        <button id="tokenSaveBtn" class="btn btn-primary">Save</button>
      </div>

      <div class="card">
        <h3>Site</h3>
        <label>Site / Client *
          <input id="siteInput" list="siteOptions" type="text" placeholder="e.g. Holy Spirit Catholic Primary School" />
          <datalist id="siteOptions"></datalist>
        </label>
        <label>Location <span class="hint">(area within the site, e.g. Tuckshop)</span>
          <input id="locationInput" type="text" />
        </label>
      </div>

      <div id="scanArea" class="card">
        <h3>Photograph the test tag / nameplate</h3>
        <input id="photoInput" type="file" accept="image/*" capture="environment" />
        <div id="preview"></div>
        <button id="extractBtn" class="btn btn-primary" disabled>Read Tag</button>
        <div id="extractStatus" class="status"></div>
      </div>

      <div id="resultCard" class="card" style="display:none;">
        <h3>Confirm asset details</h3>
        <label>Appliance<input id="f_appliance" type="text" /></label>
        <label>Plant No.<input id="f_plant_no" type="text" /></label>
        <label>Brand<input id="f_brand" type="text" /></label>
        <label>Model No.<input id="f_model_no" type="text" /></label>
        <label>Serial No.<input id="f_serial_no" type="text" /></label>
        <div id="existingNotice" class="notice" style="display:none;"></div>
        <button id="saveAssetBtn" class="btn btn-primary">Save to Register</button>
      </div>

      <div id="testCard" class="card" style="display:none;">
        <h3>Log test result</h3>
        <label>Tag No. <span class="hint">(new tag applied this cycle)</span><input id="t_tag_no" type="text" /></label>
        <label>Tester Name<input id="t_tester_name" type="text" /></label>
        <label>Tester Licence<input id="t_tester_licence" type="text" /></label>
        <label>Result *
          <select id="t_result">
            <option value="pass">Pass</option>
            <option value="fail">Fail</option>
          </select>
        </label>
        <label>Test Date<input id="t_test_date" type="date" /></label>
        <label>Next Due<input id="t_next_due" type="date" /></label>
        <label>Notes<textarea id="t_notes" rows="2"></textarea></label>
        <button id="saveTestBtn" class="btn btn-success">Log Test</button>
        <div id="testStatus" class="status"></div>
      </div>
    </section>

    <!-- REGISTER TAB -->
    <section id="tab-register" class="tab-panel">
      <div class="card">
        <div class="register-toolbar">
          <input id="siteFilter" list="siteOptionsRegister" type="text" placeholder="Filter by site..." />
          <datalist id="siteOptionsRegister"></datalist>
          <input id="searchInput" type="text" placeholder="Search plant no., appliance, location, serial..." />
        </div>
        <div class="register-toolbar">
          <button id="refreshBtn" class="btn">Refresh</button>
          <button id="exportBtn" class="btn btn-primary">Export .xlsx</button>
          <label class="btn" for="importInput">Import Register</label>
          <input id="importInput" type="file" accept=".xlsx,.xls,.csv" style="display:none;" />
        </div>
        <div id="importStatus" class="status"></div>
        <div id="registerList"></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
